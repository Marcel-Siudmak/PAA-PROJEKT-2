<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Szachy – Gracz vs Bot</title>
  <meta name="description" content="Zagraj w szachy przeciwko silnikowi szachowemu z minimaxem i alpha-beta pruning." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===========================
       DESIGN SYSTEM
    =========================== */
    :root {
      --bg:         #0d1117;
      --surface:    #161b22;
      --surface-2:  #21262d;
      --border:     #30363d;
      --accent:     #7c3aed;
      --accent-glow:#a855f7;
      --gold:       #f59e0b;
      --green:      #22c55e;
      --red:        #ef4444;
      --text:       #e6edf3;
      --text-muted: #8b949e;
      --light-sq:   #f0d9b5;
      --dark-sq:    #b58863;
      --selected:   rgba(124, 58, 237, 0.55);
      --legal-dot:  rgba(124, 58, 237, 0.40);
      --last-move:  rgba(252, 196,  25, 0.38);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    /* ===========================
       HEADER
    =========================== */
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent-glow), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* ===========================
       LAYOUT
    =========================== */
    .layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1100px;
      width: 100%;
    }

    /* ===========================
       SIDEBAR
    =========================== */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 220px;
      max-width: 260px;
      flex: 1;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .card h3 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Wskaźnik koloru */
    .player-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .player-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .player-dot.white { background: #fff; border: 1px solid #999; }
    .player-dot.black { background: #1a1a1a; border: 1px solid #555; }

    /* Status */
    #status-text {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      min-height: 24px;
    }
    #status-text.check  { color: var(--gold); }
    #status-text.win    { color: var(--green); }
    #status-text.draw   { color: var(--text-muted); }

    /* Bot info */
    #bot-info {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.6;
      word-break: break-word;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.18s ease;
      width: 100%;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #5b21b6);
      color: #fff;
      box-shadow: 0 0 16px rgba(124,58,237,0.4);
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 0 24px rgba(168,85,247,0.6);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--border);
    }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .thinking .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tryb gry */
    .mode-toggle {
      display: flex;
      gap: 8px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Historia ruchów */
    #move-history {
      font-size: 0.82rem;
      color: var(--text-muted);
      max-height: 200px;
      overflow-y: auto;
      line-height: 1.8;
    }
    #move-history::-webkit-scrollbar { width: 4px; }
    #move-history::-webkit-scrollbar-track { background: transparent; }
    #move-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .move-pair { display: flex; gap: 8px; }
    .move-num { color: var(--text-muted); min-width: 24px; }
    .move-w, .move-b { color: var(--text); font-weight: 500; min-width: 48px; }

    /* ===========================
       SZACHOWNICA
    =========================== */
    .board-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .board-container {
      position: relative;
      user-select: none;
    }

    /* Etykiety kolumn/wierszy */
    .board-labels-top,
    .board-labels-bottom {
      display: flex;
      padding-left: 24px;
      gap: 0;
    }
    .board-labels-left,
    .board-labels-right {
      position: absolute;
      top: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .board-labels-left { left: 0; }
    .board-labels-right { right: 0; }

    .coord-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .board-inner {
      display: grid;
      grid-template-columns: 24px repeat(8, 1fr) 24px;
      grid-template-rows: repeat(8, 1fr) 24px;
      /* board itself is 8x8 cells */
    }

    /* Uproszczone: używamy CSS grid bezpośrednio dla szachownicy */
    #chessboard {
      display: grid;
      grid-template-columns: repeat(8, var(--cell));
      grid-template-rows: repeat(8, var(--cell));
      --cell: clamp(52px, 9vmin, 80px);
      border: 2px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px var(--border),
        0 24px 64px rgba(0,0,0,0.6),
        0 0 80px rgba(124,58,237,0.08);
    }

    .cell {
      width: var(--cell);
      height: var(--cell);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: filter 0.1s;
    }
    .cell.light { background: var(--light-sq); }
    .cell.dark  { background: var(--dark-sq); }
    .cell.selected { background: var(--selected) !important; }
    .cell.last-move { filter: brightness(1.25); }
    .cell.last-move::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--last-move);
      pointer-events: none;
    }
    .cell.legal-move::before {
      content: '';
      position: absolute;
      width: 32%;
      height: 32%;
      border-radius: 50%;
      background: var(--legal-dot);
      pointer-events: none;
      z-index: 2;
    }
    .cell.legal-capture::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 0;
      border: 5px solid var(--legal-dot);
      background: transparent;
      pointer-events: none;
      z-index: 2;
    }

    /* Etykiety na planszy */
    .cell .coord {
      position: absolute;
      font-size: 0.6rem;
      font-weight: 700;
      line-height: 1;
      opacity: 0.55;
      pointer-events: none;
    }
    .cell .coord.file { bottom: 2px; right: 3px; }
    .cell .coord.rank { top: 2px; left: 3px; }
    .cell.light .coord { color: var(--dark-sq); }
    .cell.dark  .coord { color: var(--light-sq); }

    /* Figury */
    .piece {
      font-size: calc(var(--cell) * 0.72);
      line-height: 1;
      z-index: 3;
      position: relative;
      transition: transform 0.08s ease;
      pointer-events: none;
    }
    .cell:hover .piece { transform: scale(1.06); }
    /* Kolory figur */
    .piece.piece-white {
      color: #f5ede0;
      -webkit-text-stroke: 1.5px #7c5c3a;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.55));
    }
    .piece.piece-black {
      color: #1a1a2e;
      -webkit-text-stroke: 1px #000;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
    }

    /* Animacja ruchu */
    @keyframes piecePlace {
      from { transform: scale(0.75) rotate(-4deg); opacity: 0.6; }
      to   { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .piece-placed { animation: piecePlace 0.18s ease; }

    /* ===========================
       PROMOTION DIALOG
    =========================== */
    .dialog-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .dialog-overlay.open { display: flex; }
    .dialog {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.8);
    }
    .dialog h2 {
      font-size: 1rem;
      margin-bottom: 20px;
      color: var(--text-muted);
    }
    .promo-pieces {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .promo-btn {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .promo-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.08);
    }

    /* ===========================
       TOAST NOTIFICATION
    =========================== */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      z-index: 200;
      white-space: nowrap;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

  </style>
</head>
<body>
  <header>
    <h1>♟ Szachy – Gracz vs Bot</h1>
    <p>Minimax z Alpha-Beta Pruning i Transposition Table</p>
  </header>

  <div class="layout">

    <!-- LEWY SIDEBAR -->
    <div class="sidebar">
      <div class="card">
        <h3>Tryb gry</h3>
        <div class="mode-toggle">
          <button class="mode-btn active" id="mode-white" onclick="setMode('white')">Białe</button>
          <button class="mode-btn" id="mode-black" onclick="setMode('black')">Czarne</button>
          <button class="mode-btn" id="mode-both" onclick="setMode('both')">Oba</button>
        </div>
      </div>

      <div class="card">
        <h3>Stan gry</h3>
        <div class="player-indicator" id="current-player">
          <span class="player-dot white" id="player-dot"></span>
          <span id="player-name">Twoja kolej (Białe)</span>
        </div>
        <div style="margin-top:12px">
          <div id="status-text"></div>
        </div>
      </div>

      <div class="card">
        <h3>Akcje</h3>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="btn btn-primary" id="bot-btn" onclick="triggerBot()">
            <span class="spinner" id="spinner"></span>
            <span id="bot-btn-text">🤖 Ruch Bota</span>
          </button>
          <button class="btn btn-secondary" onclick="resetGame()">↺ Nowa gra</button>
        </div>
      </div>

      <div class="card">
        <h3>Ostatni ruch bota</h3>
        <div id="bot-info">–</div>
      </div>
    </div>

    <!-- SZACHOWNICA -->
    <div class="board-wrap">
      <div id="coords-top" style="display:flex; padding-left:0; gap:0; width:100%;"></div>
      <div style="display:flex; align-items:stretch; gap:0;">
        <div id="coords-left" style="display:flex; flex-direction:column;"></div>
        <div id="chessboard"></div>
        <div id="coords-right" style="display:flex; flex-direction:column;"></div>
      </div>
      <div id="coords-bottom" style="display:flex; gap:0; width:100%;"></div>
    </div>

    <!-- PRAWY SIDEBAR -->
    <div class="sidebar">
      <div class="card">
        <h3>Historia ruchów</h3>
        <div id="move-history">
          <span style="color:var(--text-muted); font-size:0.8rem;">Gra się jeszcze nie zaczęła…</span>
        </div>
      </div>
    </div>

  </div>

  <!-- DIALOG PROMOCJI -->
  <div class="dialog-overlay" id="promo-dialog">
    <div class="dialog">
      <h2>Wybierz figurę do promocji</h2>
      <div class="promo-pieces" id="promo-pieces"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <script>
    // ============================================================
    // STAŁE I STAN
    // ============================================================
    const API = 'http://localhost:8080';

    const PIECE_UNICODE = {
      wP:'♙', wN:'♘', wB:'♗', wR:'♖', wQ:'♕', wK:'♔',
      bP:'♟', bN:'♞', bB:'♝', bR:'♜', bQ:'♛', bK:'♚',
    };

    let state = null;           // ostatni stan z serwera
    let selectedSq = null;      // aktualnie zaznaczone pole (0-63)
    let legalTargets = [];      // legalne pola docelowe z wybranego pola
    let lastMove = null;        // {from, to} ostatniego ruchu
    let moveHistory = [];       // historia ruchów ["e2e4", ...]
    let playerMode = 'white';   // 'white' | 'black' | 'both'
    let thinking = false;

    // ============================================================
    // BUDOWANIE PLANSZY
    // ============================================================
    function buildBoard() {
      const board = document.getElementById('chessboard');
      board.innerHTML = '';

      // Oblicz rozmiar komórki
      const cell = parseInt(getComputedStyle(board).getPropertyValue('--cell'));

      for (let row = 7; row >= 0; row--) {
        for (let col = 0; col < 8; col++) {
          const sq = row * 8 + col;
          const isLight = (row + col) % 2 !== 0;

          const div = document.createElement('div');
          div.className = `cell ${isLight ? 'light' : 'dark'}`;
          div.dataset.sq = sq;
          div.id = `sq-${sq}`;
          div.onclick = () => onCellClick(sq);

          // Etykiety (plik na dole-prawo, rank na górze-lewo) tylko na krawędziach
          if (row === 0) {
            const f = document.createElement('span');
            f.className = 'coord file';
            f.textContent = 'abcdefgh'[col];
            div.appendChild(f);
          }
          if (col === 0) {
            const r = document.createElement('span');
            r.className = 'coord rank';
            r.textContent = row + 1;
            div.appendChild(r);
          }

          board.appendChild(div);
        }
      }
    }

    // ============================================================
    // RENDEROWANIE STANU
    // ============================================================
    function render(s) {
      if (!s) return;
      state = s;

      // Wyczyść klasy
      document.querySelectorAll('.cell').forEach(c => {
        c.classList.remove('selected','legal-move','legal-capture','last-move');
        // usuń figury
        c.querySelectorAll('.piece').forEach(p => p.remove());
      });

      // Narysuj figury
      for (let sq = 0; sq < 64; sq++) {
        const piece = s.pieces[sq];
        if (!piece) continue;
        const cell = document.getElementById(`sq-${sq}`);
        if (!cell) continue;
        const span = document.createElement('span');
        const colorClass = piece[0] === 'w' ? 'piece-white' : 'piece-black';
        span.className = `piece piece-placed ${colorClass}`;
        span.textContent = PIECE_UNICODE[piece] || '?';
        cell.appendChild(span);
      }

      // Ostatni ruch
      if (lastMove) {
        document.getElementById(`sq-${lastMove.from}`)?.classList.add('last-move');
        document.getElementById(`sq-${lastMove.to}`)?.classList.add('last-move');
      }

      // Zaznaczenie
      if (selectedSq !== null) {
        document.getElementById(`sq-${selectedSq}`)?.classList.add('selected');
        // Legalne ruchy
        for (const target of legalTargets) {
          const el = document.getElementById(`sq-${target}`);
          if (!el) continue;
          const hasPiece = s.pieces[target] !== null;
          el.classList.add(hasPiece ? 'legal-capture' : 'legal-move');
        }
      }

      // Status
      updateStatus(s);
      updateBotInfo(s);
    }

    function updateStatus(s) {
      const dot = document.getElementById('player-dot');
      const name = document.getElementById('player-name');
      const statusEl = document.getElementById('status-text');
      statusEl.className = '';

      if (s.status === 'running') {
        const isWhite = s.sideToMove === 'white';
        dot.className = `player-dot ${isWhite ? 'white' : 'black'}`;

        if (s.inCheck) {
          name.textContent = isWhite ? 'Białe — SZACH!' : 'Czarne — SZACH!';
          statusEl.textContent = '⚡ Szach!';
          statusEl.className = 'check';
        } else {
          name.textContent = isWhite ? 'Kolej: Białe' : 'Kolej: Czarne';
          statusEl.textContent = '';
        }

        // Automatyczny ruch bota
        scheduleAutoBot(s);
      } else {
        statusEl.className = s.status === 'checkmate' ? 'win' : 'draw';
        statusEl.textContent = s.statusMessage;
        name.textContent = '– Koniec gry –';
        document.getElementById('bot-btn').disabled = true;
        selectedSq = null;
        legalTargets = [];
        showToast(s.statusMessage, 4000);
      }
    }

    function scheduleAutoBot(s) {
      const isWhiteTurn = s.sideToMove === 'white';
      const botShouldPlay = (playerMode === 'both') ||
                            (playerMode === 'white' && !isWhiteTurn) ||
                            (playerMode === 'black' &&  isWhiteTurn);
      if (botShouldPlay && !thinking) {
        setTimeout(() => triggerBot(), 350);
      }
      document.getElementById('bot-btn').disabled =
        thinking || (s.status !== 'running');
    }

    function updateBotInfo(s) {
      const el = document.getElementById('bot-info');
      if (s.botInfo) {
        // Sformatuj
        const parts = s.botInfo.split('|').map(p => p.trim());
        el.innerHTML = parts.map(p => `<div>${p}</div>`).join('');
      } else {
        el.textContent = '–';
      }
    }

    // ============================================================
    // KLIKNIĘCIE W POLE
    // ============================================================
    function onCellClick(sq) {
      if (!state || state.status !== 'running' || thinking) return;

      const isWhiteTurn = state.sideToMove === 'white';
      // W trybie 'white' gracz steruje białymi; w 'black' — czarnymi
      if (playerMode === 'white' && !isWhiteTurn) return;
      if (playerMode === 'black' &&  isWhiteTurn) return;

      // Jeśli mamy zaznaczone pole i klikamy cel
      if (selectedSq !== null && legalTargets.includes(sq)) {
        // Sprawdź promocję
        const moveStr = sqName(selectedSq) + sqName(sq);
        const promoMoves = state.legalMoves.filter(m =>
          m.startsWith(moveStr) && m.length === 5
        );
        if (promoMoves.length > 0) {
          // Dialog promocji
          showPromoDialog(moveStr, isWhiteTurn);
        } else {
          doMove(moveStr);
        }
        return;
      }

      // Klikamy figurę własnego koloru
      const piece = state.pieces[sq];
      if (!piece) {
        selectedSq = null;
        legalTargets = [];
        render(state);
        return;
      }
      const pieceColor = piece[0]; // 'w' lub 'b'
      const ownColor = isWhiteTurn ? 'w' : 'b';
      if (pieceColor !== ownColor) {
        selectedSq = null;
        legalTargets = [];
        render(state);
        return;
      }

      selectedSq = sq;
      const prefix = sqName(sq);
      legalTargets = state.legalMoves
        .filter(m => m.slice(0, 2) === prefix)
        .map(m => notationToSq(m.slice(2, 4)));

      render(state);
    }

    // ============================================================
    // WYKONANIE RUCHU
    // ============================================================
    async function doMove(moveStr) {
      try {
        const res = await fetch(`${API}/move`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ move: moveStr }),
        });
        const data = await res.json();
        if (data.error) { showToast('❌ ' + data.error); return; }

        const fromSq = notationToSq(moveStr.slice(0, 2));
        const toSq   = notationToSq(moveStr.slice(2, 4));
        lastMove = { from: fromSq, to: toSq };
        addMoveToHistory(moveStr, data.sideToMove === 'white');

        selectedSq = null;
        legalTargets = [];
        render(data);
      } catch(e) {
        showToast('❌ Błąd połączenia z serwerem');
      }
    }

    // ============================================================
    // RUCH BOTA
    // ============================================================
    async function triggerBot() {
      if (!state || state.status !== 'running' || thinking) return;
      thinking = true;
      const btn = document.getElementById('bot-btn');
      btn.disabled = true;
      btn.classList.add('thinking');
      document.getElementById('bot-btn-text').textContent = 'Bot myśli…';

      try {
        const res = await fetch(`${API}/bot`, { method: 'POST' });
        const data = await res.json();
        if (data.error) { showToast('❌ ' + data.error); return; }

        // Odczytaj ruch bota z historii legalMoves vs poprzedniego stanu
        // Użyj botInfo do parsowania ruchu
        if (data.botInfo) {
          const m = data.botInfo.match(/Bot zagrał: ([a-h][1-8][a-h][1-8][qrbn]?)/);
          if (m) {
            const mv = m[1];
            const fromSq = notationToSq(mv.slice(0, 2));
            const toSq   = notationToSq(mv.slice(2, 4));
            lastMove = { from: fromSq, to: toSq };
            addMoveToHistory(mv, data.sideToMove === 'white');
          }
        }

        selectedSq = null;
        legalTargets = [];
        render(data);
      } catch(e) {
        showToast('❌ Błąd połączenia z serwerem');
      } finally {
        thinking = false;
        document.getElementById('bot-btn').disabled = (state?.status !== 'running');
        document.getElementById('bot-btn').classList.remove('thinking');
        document.getElementById('bot-btn-text').textContent = '🤖 Ruch Bota';
      }
    }

    // ============================================================
    // RESET
    // ============================================================
    async function resetGame() {
      try {
        const res = await fetch(`${API}/reset`, { method: 'POST' });
        const data = await res.json();
        lastMove = null;
        selectedSq = null;
        legalTargets = [];
        moveHistory = [];
        renderMoveHistory();
        document.getElementById('bot-btn').disabled = false;
        render(data);
        showToast('♟ Nowa gra rozpoczęta!');
      } catch(e) {
        showToast('❌ Błąd połączenia z serwerem');
      }
    }

    // ============================================================
    // TRYB GRY
    // ============================================================
    function setMode(mode) {
      playerMode = mode;
      ['white','black','both'].forEach(m => {
        document.getElementById(`mode-${m}`).classList.toggle('active', m === mode);
      });
      if (state) scheduleAutoBot(state);
    }

    // ============================================================
    // DIALOG PROMOCJI
    // ============================================================
    function showPromoDialog(baseMove, isWhite) {
      const dialog = document.getElementById('promo-dialog');
      const piecesEl = document.getElementById('promo-pieces');
      piecesEl.innerHTML = '';
      const promos = [
        { char: 'q', icon: isWhite ? '♕' : '♛' },
        { char: 'r', icon: isWhite ? '♖' : '♜' },
        { char: 'b', icon: isWhite ? '♗' : '♝' },
        { char: 'n', icon: isWhite ? '♘' : '♞' },
      ];
      for (const p of promos) {
        const btn = document.createElement('button');
        btn.className = 'promo-btn';
        btn.textContent = p.icon;
        btn.onclick = () => {
          dialog.classList.remove('open');
          doMove(baseMove + p.char);
        };
        piecesEl.appendChild(btn);
      }
      dialog.classList.add('open');
    }

    // ============================================================
    // HISTORIA RUCHÓW
    // ============================================================
    function addMoveToHistory(mv, wasWhiteTurn) {
      // wasWhiteTurn = true oznacza że BIAŁE właśnie zagrały (sideToMove to teraz czarny)
      // Ale parseujemy to lepiej: dodajemy ruch i renderujemy
      moveHistory.push(mv);
      renderMoveHistory();
    }

    function renderMoveHistory() {
      const el = document.getElementById('move-history');
      if (moveHistory.length === 0) {
        el.innerHTML = '<span style="color:var(--text-muted); font-size:0.8rem;">Brak ruchów…</span>';
        return;
      }
      let html = '';
      for (let i = 0; i < moveHistory.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const white = moveHistory[i] || '';
        const black = moveHistory[i+1] || '';
        html += `<div class="move-pair">
          <span class="move-num">${moveNum}.</span>
          <span class="move-w">${white}</span>
          <span class="move-b">${black}</span>
        </div>`;
      }
      el.innerHTML = html;
      el.scrollTop = el.scrollHeight;
    }

    // ============================================================
    // TOAST
    // ============================================================
    let toastTimeout = null;
    function showToast(msg, duration = 2500) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => t.classList.remove('show'), duration);
    }

    // ============================================================
    // POMOCNICZE
    // ============================================================
    function sqName(sq) {
      return 'abcdefgh'[sq % 8] + (Math.floor(sq / 8) + 1);
    }
    function notationToSq(note) {
      const col = note.charCodeAt(0) - 'a'.charCodeAt(0);
      const row = parseInt(note[1]) - 1;
      return row * 8 + col;
    }

    // ============================================================
    // INICJALIZACJA
    // ============================================================
    async function init() {
      buildBoard();
      try {
        const res = await fetch(`${API}/state`);
        const data = await res.json();
        render(data);
      } catch(e) {
        showToast('❌ Nie można połączyć z serwerem. Uruchom chess_gui!', 6000);
      }
    }

    init();
  </script>
</body>
</html>
